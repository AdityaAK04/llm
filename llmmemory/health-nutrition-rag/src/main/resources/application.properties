spring.application.name=health-nutrition-rag

# Mistral AI Configuration loaded from Environment Variable
spring.ai.mistralai.api-key=${MISTRAL_API_KEY}

spring.ai.mistralai.chat.options.model=mistral-small-latest
spring.ai.mistralai.embedding.options.model=mistral-embed

# File Upload Constraints
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Vector Store Persistence Path
spring.ai.vectorstore.simple.store.path=vectorstore.json